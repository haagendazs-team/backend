# 로컬 개발 전용 — RAM 8~12GB 최적화
# 모니터링(Prometheus/Grafana/postgres-exporter) 제외, JVM/인프라 메모리 최소화
# 사용법: docker compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: haagendazs-postgres
    environment:
      POSTGRES_DB: haagendazs
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # shared_buffers/work_mem 최소화 — 로컬 개발용 (~80MB 사용)
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c log_min_duration_statement=1000
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ 데이터 경로 변경: /var/lib/postgresql/data → /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d haagendazs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: haagendazs-redis
    # maxmemory 64mb — 로컬에서 Rate Limiting 키 저장 용도로 충분
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: haagendazs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 로컬 최소화: 256MB heap (기본 512MB에서 절반)
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - bootstrap.memory_lock=false
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
  es-data:
