# 로컬 개발용 인프라 + 서비스
# 사용법: docker compose -f docker-compose.local.yml up -d
# 모니터링 포함 시: docker compose -f docker-compose.local.yml -f docker-compose.monitoring.yml up -d

services:
  # ───────────────────────────────────────────
  # 인프라
  # ───────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: haagendazs-postgres
    environment:
      POSTGRES_DB: haagendazs
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c log_min_duration_statement=1000
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d haagendazs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: haagendazs-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: haagendazs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - bootstrap.memory_lock=false
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 20s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: haagendazs-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ───────────────────────────────────────────
  # 애플리케이션 서비스 (기동 순서: config → discovery → gateway → 도메인)
  # ───────────────────────────────────────────
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: haagendazs-config-server
    environment:
      - GITHUB_CONFIG_SERVER=${GITHUB_CONFIG_SERVER}
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 5

  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: haagendazs-discovery
    environment:
      - EUREKA_SERVER_URI=${EUREKA_SERVER_URI:-http://discovery:8761/eureka}
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: haagendazs-gateway
    environment:
      - EUREKA_SERVER_URI=${EUREKA_SERVER_URI:-http://discovery:8761/eureka}
      - CONFIG_SERVER_URI=http://config-server:8888
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FRONT_URI=${FRONT_URI:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      discovery:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    container_name: haagendazs-notification
    environment:
      - EUREKA_SERVER_URI=${EUREKA_SERVER_URI:-http://discovery:8761/eureka}
      - CONFIG_SERVER_URI=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-haagendazs}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  member:
    build:
      context: ./member
      dockerfile: Dockerfile
    container_name: haagendazs-member
    environment:
      - EUREKA_SERVER_URI=${EUREKA_SERVER_URI:-http://discovery:8761/eureka}
      - CONFIG_SERVER_URI=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-haagendazs}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    container_name: haagendazs-payment
    environment:
      - EUREKA_SERVER_URI=${EUREKA_SERVER_URI:-http://discovery:8761/eureka}
      - CONFIG_SERVER_URI=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-haagendazs}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  search:
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: haagendazs-search
    environment:
      - EUREKA_SERVER_URI=${EUREKA_SERVER_URI:-http://discovery:8761/eureka}
      - CONFIG_SERVER_URI=http://config-server:8888
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-haagendazs}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      discovery:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  es-data:
  kafka-data:
