<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Demo Console</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<main class="app">
    <header class="topbar">
        <div>
            <p class="eyebrow">Toss Payments Demo</p>
            <h1>구독 결제 시연 콘솔</h1>
        </div>
        <div class="status" id="apiStatus">ready</div>
    </header>

    <section class="panel config-panel">
        <div class="panel-title">
            <h2>실행 설정</h2>
            <button type="button" id="saveConfigBtn">저장</button>
        </div>
        <div class="form-grid">
            <label>
                Member ID
                <input id="memberIdInput" type="number" min="1" value="1" />
            </label>
            <label>
                Workspace ID
                <input id="workspaceIdInput" type="number" min="1" value="1" />
            </label>
            <label class="wide">
                Toss Client Key
                <input id="clientKeyInput" type="text" placeholder="test_ck_..." />
            </label>
        </div>
    </section>

    <section class="grid two">
        <article class="panel">
            <div class="panel-title">
                <h2>상품 / 구독</h2>
                <button type="button" id="refreshCatalogBtn">새로고침</button>
            </div>
            <div class="split">
                <div>
                    <h3>상품</h3>
                    <div id="products" class="product-list"></div>
                </div>
                <div>
                    <h3>현재 구독</h3>
                    <pre id="subscriptionBox" class="data-box">-</pre>
                    <h3>예약 변경</h3>
                    <pre id="scheduledChangeBox" class="data-box">-</pre>
                    <button type="button" id="cancelPlanChangeBtn" class="danger">예약 취소</button>
                </div>
            </div>
        </article>

        <article class="panel">
            <div class="panel-title">
                <h2>주문 생성</h2>
                <button type="button" id="newAttemptBtn">새 주문 시도</button>
            </div>
            <div class="stack">
                <label>
                    선택 상품 ID
                    <input id="selectedProductIdInput" type="number" min="1" />
                </label>
                <label>
                    주문 생성 Idempotency-Key
                    <input id="orderIdempotencyKeyInput" type="text" />
                </label>
                <div class="button-row">
                    <button type="button" id="createOrderBtn">주문 생성</button>
                    <button type="button" id="createOrderTwiceBtn">중복 클릭 테스트</button>
                </div>
                <pre id="currentOrderBox" class="data-box">-</pre>
            </div>
        </article>
    </section>

    <section class="grid two">
        <article class="panel">
            <div class="panel-title">
                <h2>자동결제 수단 / 결제</h2>
                <button type="button" id="prepareBillingBtn">등록 준비</button>
            </div>
            <div class="stack">
                <pre id="billingPrepareBox" class="data-box">-</pre>
                <div class="button-row">
                    <button type="button" id="requestBillingAuthBtn">Toss 결제수단 등록창</button>
                    <button type="button" id="payRegisteredBtn">등록된 수단으로 결제</button>
                </div>
                <div class="button-row">
                    <button type="button" id="confirmBillingOnlyBtn">authKey로 수단 등록</button>
                    <button type="button" id="confirmAndPayBtn">authKey 등록 + 주문 결제</button>
                </div>
                <label>
                    authKey
                    <input id="authKeyInput" type="text" placeholder="successUrl로 받은 authKey" />
                </label>
            </div>
        </article>

        <article class="panel">
            <div class="panel-title">
                <h2>플랜 변경</h2>
            </div>
            <div class="stack">
                <label>
                    변경할 상품 ID
                    <input id="planChangeProductIdInput" type="number" min="1" />
                </label>
                <button type="button" id="changePlanBtn">플랜 변경 요청</button>
                <pre id="planChangeBox" class="data-box">-</pre>
            </div>
        </article>
    </section>

    <section class="panel">
        <div class="panel-title">
            <h2>주문 목록 / 상세</h2>
            <button type="button" id="refreshOrdersBtn">주문 조회</button>
        </div>
        <div class="orders-layout">
            <div id="orders" class="order-list"></div>
            <pre id="orderDetailBox" class="data-box detail-box">-</pre>
        </div>
    </section>

    <section class="panel">
        <div class="panel-title">
            <h2>실행 로그</h2>
            <button type="button" id="clearLogBtn">비우기</button>
        </div>
        <pre id="logBox" class="log-box"></pre>
    </section>
</main>
<script src="./app.js"></script>
</body>
</html>
