plugins {
    id 'org.springframework.boot'
    id 'jacoco'
}

// payment 서비스 — MVC(Tomcat) 기반 결제 도메인
// DB: PostgreSQL, 스키마: payment (application.yml currentSchema=payment)
// ORM: Spring Data JPA + Hibernate (블로킹 JDBC — Tomcat 스레드 모델에서만 사용할 것)
// 마이그레이션: Flyway V{n}__{설명}.sql — 추가만 가능, 수정 금지
// 동시성: 결제는 핵심 도메인 — Optimistic/Pessimistic Lock 전략 신중히 선택할 것
// QueryDSL 사용 시 루트 build.gradle의 querydslVersion 참조하여 의존성 추가
repositories {
    mavenCentral()
}
dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    //lombok
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    testCompileOnly("org.projectlombok:lombok:1.18.46")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.46")

    //카프카
    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation project(':notification').sourceSets.main.output
    testImplementation 'io.projectreactor.kafka:reactor-kafka:1.3.25'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testRuntimeOnly 'com.h2database:h2'
}

jacoco {
    toolVersion = '0.8.15'
}

test {
    finalizedBy jacocoTestReport
    useJUnitPlatform {
        excludeTags 'seed'
    }

    doFirst {
        if (filter.commandLineIncludePatterns.empty) {
            options.excludeTags 'external'
        }
    }
}

tasks.register('tossRealApiTest', Test) {
    group = 'verification'
    description = '실제 Toss 테스트 API를 호출하는 결제 연동 테스트를 실행한다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'external'
        excludeTags 'card-issue', 'service-real-api'
    }

    shouldRunAfter test
}

tasks.register('tossServiceRealApiTest', Test) {
    group = 'verification'
    description = '실제 Toss 테스트 API를 호출하는 서비스 레벨 결제 연동 테스트를 실행한다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'service-real-api'
    }

    shouldRunAfter test
}

tasks.register('tossCardIssueRealApiTest', Test) {
    group = 'verification'
    description = '실제 Toss 테스트 API로 카드정보 billingKey 발급/삭제 테스트를 실행한다.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'card-issue'
    }

    shouldRunAfter test
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 커버리지 집계 대상: 서비스 로직과 도메인 엔티티
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, include: [
                'com/haagendazs/payment/**/service/**',
                'com/haagendazs/payment/**/entity/**',
            ], exclude: [
                'com/haagendazs/payment/**/service/dto/**',
                'com/haagendazs/payment/**/service/tools/TossBillingClient.class',
                'com/haagendazs/payment/**/service/tools/TossPaymentConfig.class',
                'com/haagendazs/payment/**/global/SubscriptionExpirationScheduler.class',
                'com/haagendazs/payment/**/Q*.class',
            ])
        }))
    }
}
