global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080

  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification:8081

  - job_name: member
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - member:8082

  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment:8083

  - job_name: chat
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - chat:8085

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888

  - job_name: discovery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - discovery:8761
