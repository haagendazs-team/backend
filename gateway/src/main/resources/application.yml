server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  # Redis Rate Limiting용 — spring.data.redis가 올바른 키
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      # Spring Cloud Gateway 5.x (Boot 4.x): 라우트 키가 server.webflux 하위로 이동
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: notification-service
              uri: lb://notification
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1

            - id: payment-service
              uri: lb://payment
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1

            - id: member-service
              uri: lb://member
              predicates:
                - Path=/api/members/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: gateway

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
