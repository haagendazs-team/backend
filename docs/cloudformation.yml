AWSTemplateFormatVersion: '2010-09-09'
Description: 'Haagendazs MSA - ECS Fargate, RDS, ElastiCache, Kafka EC2 (KRaft)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password

  SlackWebhookUrl:
    Type: String
    NoEcho: true
    Description: Slack Incoming Webhook URL for notifications

  RedisPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Redis auth token

  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret

  ConfigGitUri:
    Type: String
    Description: Git URI for config-server

  GithubConfigServer:
    Type: String
    Description: GitHub token for config-server

Resources:
  # ============================================================================
  # VPC
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub haagendazs-vpc-${Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub haagendazs-public-1-${Environment}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub haagendazs-public-2-${Environment}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      Tags:
        - Key: Name
          Value: !Sub haagendazs-private-1-${Environment}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.4.0/24
      Tags:
        - Key: Name
          Value: !Sub haagendazs-private-2-${Environment}

  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  # ============================================================================
  # 보안 그룹
  # ============================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB inbound 80/443
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub haagendazs-alb-sg-${Environment}

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Fargate tasks
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub haagendazs-ecs-sg-${Environment}

  # ALB → gateway(8080)
  ECSIngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ALBSecurityGroup

  # ECS → ECS (서비스 간 통신, 전체 포트)
  ECSIngressFromECS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref ECSSecurityGroup

  KafkaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kafka EC2 broker
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          SourceSecurityGroupId: !Ref ECSSecurityGroup
        - IpProtocol: tcp
          FromPort: 29092
          ToPort: 29092
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub haagendazs-kafka-sg-${Environment}

  PostgreSQLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL EC2 instances
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub haagendazs-postgres-sg-${Environment}

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub haagendazs-redis-sg-${Environment}

  # ============================================================================
  # PostgreSQL EC2 — 서비스별 t3.micro (최저 비용)
  # ============================================================================
  MemberPostgresInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.micro
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds:
        - !Ref PostgreSQLSecurityGroup
      SubnetId: !Ref PrivateSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y postgresql15-server
          postgresql-setup --initdb
          sed -i "s|host    all             all             127.0.0.1/32            ident|host    all             all             0.0.0.0/0               md5|" /var/lib/pgsql/data/pg_hba.conf
          echo "listen_addresses = '*'" >> /var/lib/pgsql/data/postgresql.conf
          systemctl enable postgresql
          systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD '${DBPassword}';"
          sudo -u postgres psql -c "CREATE DATABASE haagendazs;"
      Tags:
        - Key: Name
          Value: !Sub haagendazs-member-postgres-${Environment}

  PaymentPostgresInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.micro
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds:
        - !Ref PostgreSQLSecurityGroup
      SubnetId: !Ref PrivateSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y postgresql15-server
          postgresql-setup --initdb
          sed -i "s|host    all             all             127.0.0.1/32            ident|host    all             all             0.0.0.0/0               md5|" /var/lib/pgsql/data/pg_hba.conf
          echo "listen_addresses = '*'" >> /var/lib/pgsql/data/postgresql.conf
          systemctl enable postgresql
          systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD '${DBPassword}';"
          sudo -u postgres psql -c "CREATE DATABASE haagendazs;"
      Tags:
        - Key: Name
          Value: !Sub haagendazs-payment-postgres-${Environment}

  ChatPostgresInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.micro
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds:
        - !Ref PostgreSQLSecurityGroup
      SubnetId: !Ref PrivateSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y postgresql15-server
          postgresql-setup --initdb
          sed -i "s|host    all             all             127.0.0.1/32            ident|host    all             all             0.0.0.0/0               md5|" /var/lib/pgsql/data/pg_hba.conf
          echo "listen_addresses = '*'" >> /var/lib/pgsql/data/postgresql.conf
          systemctl enable postgresql
          systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD '${DBPassword}';"
          sudo -u postgres psql -c "CREATE DATABASE haagendazs;"
      Tags:
        - Key: Name
          Value: !Sub haagendazs-chat-postgres-${Environment}

  NotificationPostgresInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.micro
      IamInstanceProfile: !Ref SSMInstanceProfile
      SecurityGroupIds:
        - !Ref PostgreSQLSecurityGroup
      SubnetId: !Ref PrivateSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y postgresql15-server
          postgresql-setup --initdb
          sed -i "s|host    all             all             127.0.0.1/32            ident|host    all             all             0.0.0.0/0               md5|" /var/lib/pgsql/data/pg_hba.conf
          echo "listen_addresses = '*'" >> /var/lib/pgsql/data/postgresql.conf
          systemctl enable postgresql
          systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD '${DBPassword}';"
          sudo -u postgres psql -c "CREATE DATABASE haagendazs;"
      Tags:
        - Key: Name
          Value: !Sub haagendazs-notification-postgres-${Environment}

  # ============================================================================
  # ElastiCache Redis
  # ============================================================================
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: haagendazs Redis subnet group
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: haagendazs Redis
      AutomaticFailoverEnabled: false
      CacheNodeType: cache.t3.micro
      Engine: redis
      EngineVersion: '7.1'
      NumCacheClusters: 1
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      Tags:
        - Key: Name
          Value: !Sub haagendazs-redis-${Environment}

  # ============================================================================
  # Kafka EC2 (KRaft, 4.0.0) — SSM으로 접속, SSH 없음
  # ============================================================================
  SSMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub haagendazs-ssm-role-${Environment}
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  SSMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SSMRole

  KafkaInstance:
    Type: AWS::EC2::Instance
    Properties:
      # 서울 리전 Amazon Linux 2023 최신 AMI (동적 참조)
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.medium
      IamInstanceProfile: !Ref SSMInstanceProfile
      # KeyName 없음 — SSM Session Manager로만 접속
      SecurityGroupIds:
        - !Ref KafkaSecurityGroup
      SubnetId: !Ref PrivateSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          yum update -y
          yum install -y java-21-amazon-corretto wget

          cd /opt
          wget -q https://downloads.apache.org/kafka/4.0.0/kafka_2.13-4.0.0.tgz
          tar -xzf kafka_2.13-4.0.0.tgz
          mv kafka_2.13-4.0.0 kafka
          rm kafka_2.13-4.0.0.tgz

          PRIVATE_IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
          mkdir -p /var/lib/kafka/data

          cat > /opt/kafka/config/kraft/server.properties <<EOF
          node.id=1
          process.roles=broker,controller
          listeners=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
          advertised.listeners=INTERNAL://${PRIVATE_IP}:29092,EXTERNAL://${PRIVATE_IP}:9092
          listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          inter.broker.listener.name=INTERNAL
          controller.listener.names=CONTROLLER
          controller.quorum.voters=1@localhost:9093
          log.dirs=/var/lib/kafka/data
          auto.create.topics.enable=false
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          EOF

          CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
          /opt/kafka/bin/kafka-storage.sh format -t "$CLUSTER_ID" \
            -c /opt/kafka/config/kraft/server.properties

          cat > /etc/systemd/system/kafka.service <<EOF
          [Unit]
          Description=Apache Kafka 4.0.0 KRaft
          After=network.target

          [Service]
          Type=simple
          Environment=KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
          ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
          ExecStop=/opt/kafka/bin/kafka-server-stop.sh
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable kafka
          systemctl start kafka

          sleep 15

          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --topic member.notif.push.v1 --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --topic chat.notif.push.v1 --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --topic payment.notif.push.v1 --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --topic member.notif.email-cert.v1 --partitions 1 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --topic member.created.v1 --partitions 3 --replication-factor 1
      Tags:
        - Key: Name
          Value: !Sub haagendazs-kafka-${Environment}

  # ============================================================================
  # ECR 리포지터리
  # ============================================================================
  GatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/gateway
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  ConfigServerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/config-server
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  DiscoveryRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/discovery
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  MemberRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/member
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  PaymentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/payment
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  ChatRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/chat
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  NotificationRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: haagendazs/notification
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  # ============================================================================
  # ALB
  # ============================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub haagendazs-alb-${Environment}
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub haagendazs-gateway-tg-${Environment}
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  # ============================================================================
  # ECS 클러스터 + 공통 역할
  # ============================================================================
  ServiceNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub haagendazs.local
      Vpc: !Ref VPC

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub haagendazs-cluster-${Environment}
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ServiceConnectDefaults:
        Namespace: !Ref ServiceNamespace

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub haagendazs-ecs-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ============================================================================
  # CloudWatch 로그 그룹 (서비스별)
  # ============================================================================
  LogGroupGateway:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-gateway-${Environment}
      RetentionInDays: 7

  LogGroupConfigServer:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-config-server-${Environment}
      RetentionInDays: 7

  LogGroupDiscovery:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-discovery-${Environment}
      RetentionInDays: 7

  LogGroupMember:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-member-${Environment}
      RetentionInDays: 7

  LogGroupPayment:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-payment-${Environment}
      RetentionInDays: 7

  LogGroupChat:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-chat-${Environment}
      RetentionInDays: 7

  LogGroupNotification:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/haagendazs-notification-${Environment}
      RetentionInDays: 7

  # ============================================================================
  # ECS 태스크 정의 — 7개 서비스
  # ============================================================================

  # config-server
  TaskDefConfigServer:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub haagendazs-config-server-${Environment}
      Cpu: 512
      Memory: 1024
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      ContainerDefinitions:
        - Name: config-server
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/haagendazs/config-server:latest
          PortMappings:
            - ContainerPort: 8888
              Name: config-server
          Environment:
            - Name: CONFIG_GIT_URI
              Value: !Ref ConfigGitUri
            - Name: GITHUB_CONFIG_SERVER
              Value: !Ref GithubConfigServer
            - Name: JAVA_TOOL_OPTIONS
              Value: -Xmx256m
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupConfigServer
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # discovery
  TaskDefDiscovery:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub haagendazs-discovery-${Environment}
      Cpu: 512
      Memory: 1024
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      ContainerDefinitions:
        - Name: discovery
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/haagendazs/discovery:latest
          PortMappings:
            - ContainerPort: 8761
              Name: discovery
          Environment:
