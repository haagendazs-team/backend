  # ============================================================================
  # 스케줄링 — 평일 14:00~18:00 KST (UTC 05:00~09:00) 만 동작
  # ============================================================================

  # Lambda 실행 역할 (스케줄러 + 스택 삭제 공용)
  SchedulerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub haagendazs-scheduler-role-${Environment}
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SchedulerPolicy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: '*'
        - PolicyName: StackDeletionPolicy
          PolicyDocument:
            Statement:
              # delete-stack은 스택 내 모든 리소스를 삭제하므로 광범위 권한 필요
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:*
                  - ecs:*
                  - rds:*
                  - elasticache:*
                  - elasticloadbalancing:*
                  - ecr:*
                  - logs:*
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - events:DeleteRule
                  - events:RemoveTargets
                  - lambda:DeleteFunction
                  - lambda:RemovePermission
                Resource: '*'

  # Lambda — START/STOP 스케줄러 (Slack 알림 포함)
  SchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub haagendazs-scheduler-${Environment}
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SchedulerLambdaRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLUSTER: !Ref ECSCluster
          KAFKA_INSTANCE: !Ref KafkaInstance
          POSTGRES_INSTANCES: !Sub >-
            ${MemberPostgresInstance},
            ${PaymentPostgresInstance},
            ${ChatPostgresInstance},
            ${NotificationPostgresInstance}
          REGION: !Ref AWS::Region
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
          SERVICES: !Sub >-
            haagendazs-config-server-${Environment},
            haagendazs-discovery-${Environment},
            haagendazs-gateway-${Environment},
            haagendazs-member-${Environment},
            haagendazs-payment-${Environment},
            haagendazs-chat-${Environment},
            haagendazs-notification-${Environment}
      Code:
        ZipFile: |
          import boto3, os, json
          from urllib.request import urlopen, Request

          def notify_slack(webhook_url, message):
              req = Request(webhook_url, data=json.dumps({'text': message}).encode(), method='POST')
              req.add_header('Content-Type', 'application/json')
              with urlopen(req, timeout=5) as res:
                  return res.status

          def handler(event, context):
              region       = os.environ['REGION']
              cluster      = os.environ['CLUSTER']
              services     = [s.strip() for s in os.environ['SERVICES'].split(',')]
              kafka_id     = os.environ['KAFKA_INSTANCE']
              postgres_ids = [s.strip() for s in os.environ['POSTGRES_INSTANCES'].split(',')]
              webhook      = os.environ.get('SLACK_WEBHOOK_URL', '')
              action       = event['action']

              ecs = boto3.client('ecs', region_name=region)
              ec2 = boto3.client('ec2', region_name=region)

              desired = 1 if action == 'start' else 0

              for svc in services:
                  ecs.update_service(cluster=cluster, service=svc, desiredCount=desired)
                  print(f'ECS {svc} desiredCount={desired}')

              all_ec2_ids = [kafka_id] + postgres_ids
              if action == 'start':
                  ec2.start_instances(InstanceIds=all_ec2_ids)
                  msg = '*[haagendazs]* 서비스 시작 (평일 14:00 KST) — ECS 7개 / Kafka / PostgreSQL EC2 가동'
              else:
                  ec2.stop_instances(InstanceIds=all_ec2_ids)
                  msg = '*[haagendazs]* 서비스 종료 (평일 18:00 KST) — ECS 0개 / Kafka / PostgreSQL EC2 중단'

              print(f'EC2 {action} 완료: {all_ec2_ids}')
              if webhook:
                  notify_slack(webhook, msg)

              return {'status': 'ok', 'action': action}

  # Lambda — 2026-07-29 18:00 KST 스택 전체 삭제
  StackDeletionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub haagendazs-stack-deletion-${Environment}
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SchedulerLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          REGION: !Ref AWS::Region
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
      Code:
        ZipFile: |
          import boto3, os, json
          from urllib.request import urlopen, Request

          def notify_slack(webhook_url, message):
              req = Request(webhook_url, data=json.dumps({'text': message}).encode(), method='POST')
              req.add_header('Content-Type', 'application/json')
              with urlopen(req, timeout=5) as res:
                  return res.status

          def handler(event, context):
              region     = os.environ['REGION']
              stack_name = os.environ['STACK_NAME']
              webhook    = os.environ.get('SLACK_WEBHOOK_URL', '')

              cfn = boto3.client('cloudformation', region_name=region)
              cfn.delete_stack(StackName=stack_name)
              print(f'delete-stack 요청 완료: {stack_name}')

              if webhook:
                  notify_slack(webhook,
                      f'*[haagendazs]* 스택 삭제 시작 — `{stack_name}` (포트폴리오 운영 종료)')

              return {'status': 'ok', 'stack': stack_name}

  # EventBridge — 평일 05:00 UTC (14:00 KST) START
  ScheduleStart:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub haagendazs-start-schedule-${Environment}
      ScheduleExpression: 'cron(0 5 ? * MON-FRI *)'
      State: ENABLED
      Targets:
        - Id: StartLambda
          Arn: !GetAtt SchedulerFunction.Arn
          Input: '{"action": "start"}'

  ScheduleStartPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleStart.Arn

  # EventBridge — 평일 09:00 UTC (18:00 KST) STOP
  ScheduleStop:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub haagendazs-stop-schedule-${Environment}
      ScheduleExpression: 'cron(0 9 ? * MON-FRI *)'
      State: ENABLED
      Targets:
        - Id: StopLambda
          Arn: !GetAtt SchedulerFunction.Arn
          Input: '{"action": "stop"}'

  ScheduleStopPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleStop.Arn

  # EventBridge — 2026-07-29 09:00 UTC (18:00 KST) 스택 전체 삭제 (1회성)
  ScheduleStackDeletion:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub haagendazs-stack-deletion-${Environment}
      ScheduleExpression: 'cron(0 9 29 7 ? 2026)'
      State: DISABLED
      Targets:
        - Id: StackDeletionLambda
          Arn: !GetAtt StackDeletionFunction.Arn

  ScheduleStackDeletionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StackDeletionFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleStackDeletion.Arn

