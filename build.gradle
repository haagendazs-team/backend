plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    // Spring Cloud 2025.1.x = Spring Boot 4.0.x 전용 train (2025.0.x는 Boot 3.5.x 전용)
    set('springCloudVersion', '2025.1.3-SNAPSHOT')
    set('querydslVersion', '6.10.1')
    set('javaVersion', '25')
}

// compose 공통 베이스 인수 — stop/up 양쪽에서 재사용 (toString: ProcessBuilder는 GString 불허)
def composeBase = ['docker', 'compose', '-f', "${rootDir}/docker-compose.local.yml".toString()]

// .env 파일 파싱 클로저 — startAll·localRun 공통 사용
def loadEnvVars = {
    def envVars = [:]
    def envFile = file("${rootDir}/.env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def parts = line.split('=', 2)
                envVars[parts[0].trim()] = parts[1].trim()
            }
        }
    }
    return envVars
}

// 실행 순서: config-server → discovery → gateway → 도메인 서비스
def startOrder = [
    'config-server',
    'discovery',
    'gateway',
    'member',
    'payment',
    'notification',
    'chat'
]

// ── 문서 자동화 ──────────────────────────────────────────────────────────────
// ./gradlew test 완료 후 Redocly로 OpenAPI3(REST) + AsyncAPI 번들 생성
// 전제: Node.js / npx 설치 필요 (@redocly/cli는 npx가 온디맨드 설치)
// 출력: build/docs/bundled/notification-rest.yaml, notification-async.yaml
task redoclyBundle(type: Exec) {
    group = 'documentation'
    description = 'Redocly로 REST + AsyncAPI 스펙 번들 및 lint'
    workingDir "${rootDir}/docs"
    commandLine 'npx', '--yes', '@redocly/cli@2.35.1', 'bundle',
            '--config', 'redocly.yaml',
            '--output', "${rootDir}/build/docs/bundled"
    doFirst {
        def restSpec = file("${rootDir}/notification/build/docs/openapi3.yml")
        if (!restSpec.exists()) {
            logger.warn("[redoclyBundle] ${restSpec} 없음 — :notification:test 먼저 실행하세요")
        }
        mkdir "${rootDir}/build/docs/bundled"
    }
    ignoreExitValue = true
}

task redoclyLint(type: Exec) {
    group = 'documentation'
    description = 'Redocly lint — REST + AsyncAPI 스펙 유효성 검사'
    workingDir "${rootDir}/docs"
    commandLine 'npx', '--yes', '@redocly/cli@2.35.1', 'lint',
            '--config', 'redocly.yaml'
    ignoreExitValue = true
}

// ─────────────────────────────────────────────────────────────────────────────

task startAll {
    group = 'application'
    description = '전체 서비스를 순서대로 백그라운드 실행 (./gradlew startAll)'
    dependsOn startOrder.collect { ":${it}:bootJar" }

    doLast {
        def envVars = loadEnvVars()

        def logDir = file("${rootDir}/logs")
        logDir.mkdirs()

        startOrder.each { svc ->
            def jar = file("${rootDir}/${svc}/build/libs/${svc}-0.0.1-SNAPSHOT.jar")
            def log = file("${logDir}/${svc}.log")
            println "Starting ${svc}..."
            def pb = new ProcessBuilder('java', '-jar', jar.absolutePath)
                .redirectOutput(log)
                .redirectErrorStream(true)
                .directory(rootDir)
            pb.environment().putAll(envVars)
            pb.start()
            // config-server, discovery는 뜰 시간 확보
            if (svc in ['config-server', 'discovery']) {
                sleep(8000)
            }
        }
        println "\n모든 서비스 기동 완료. 로그: ${logDir}"
        println "Eureka: http://localhost:8761"
        println "Gateway: http://localhost:8080"
    }
}

task stopAll {
    group = 'application'
    description = '실행 중인 전체 서비스 종료 (./gradlew stopAll)'

    doLast {
        def ports = [8888, 8761, 8080, 8081, 8082, 8083, 8084, 8085]
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        ports.each { port ->
            if (isWindows) {
                def result = "cmd /c netstat -ano | findstr :${port}".execute().text.trim()
                result.readLines().each { line ->
                    def pid = line.trim().split(/\s+/).last()
                    if (pid.isInteger()) {
                        "taskkill /PID ${pid} /F".execute()
                        println "Stopped port ${port} (PID ${pid})"
                    }
                }
            } else {
                def result = "lsof -ti:${port}".execute().text.trim()
                if (result) {
                    "kill ${result}".execute()
                    println "Stopped port ${port} (PID ${result})"
                }
            }
        }
    }
}

def moduleInfra = [
    'config-server' : [],
    'discovery'     : ['config-server'],
    'gateway'       : ['redis', 'config-server', 'discovery'],
    'notification'  : ['postgres', 'redis', 'kafka', 'config-server', 'discovery'],
    'chat'          : ['postgres', 'redis', 'kafka', 'config-server', 'discovery'],
    'member'        : ['postgres', 'kafka', 'config-server', 'discovery'],
    'payment'       : ['postgres', 'kafka', 'config-server', 'discovery'],
]

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.haagendazs'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    repositories {
        mavenCentral()
        // Spring Cloud 2025.1.x-SNAPSHOT (Boot 4.0.x 지원) 전용 레포
        maven { url 'https://repo.spring.io/snapshot' }
        maven { url 'https://repo.spring.io/milestone' }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.3"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()
    }

    // Spring Boot 모듈 전용 설정
    plugins.withId('org.springframework.boot') {
        // plain jar 비활성화 — Dockerfile COPY *.jar 글로브 충돌 방지
        jar { enabled = false }

        def moduleName = project.name

        tasks.register('localRun') {
            group = 'application'
            description = "${moduleName} 개발용 — 필요한 인프라만 기동 후 실행"

            dependsOn tasks.named('bootJar')

            doFirst {
                if (!moduleInfra.containsKey(moduleName)) {
                    throw new GradleException(
                        "moduleInfra에 '${moduleName}' 항목 없음 — 루트 build.gradle 맵에 추가하세요."
                    )
                }

                def infraServices = moduleInfra[moduleName]

                println "\n[localRun] ${moduleName} 컨테이너 stop (포트 해제)..."
                new ProcessBuilder(composeBase + ['stop', moduleName])
                    .inheritIO().directory(rootDir).start().waitFor()

                if (!infraServices.isEmpty()) {
                    println "[localRun] ${moduleName} 필요 인프라 기동: ${infraServices.join(', ')}"
                    def exit = new ProcessBuilder(composeBase + ['up', '-d', '--wait'] + infraServices)
                        .inheritIO().directory(rootDir).start().waitFor()
                    if (exit != 0) {
                        throw new GradleException("[localRun] ${moduleName} 인프라 기동 실패 (exit ${exit})")
                    }
                    println "[localRun] 인프라 헬스체크 통과 완료"
                } else {
                    println "\n[localRun] ${moduleName} — 외부 인프라 의존 없음, 바로 실행"
                }
            }

            doLast {
                def envVars = loadEnvVars()
                def jar = file("${rootDir}/${moduleName}/build/libs/${moduleName}-0.0.1-SNAPSHOT.jar")
                println "[localRun] 서비스 기동: ${moduleName}"
                def pb = new ProcessBuilder(
                    'java', '-Xmx256m', '-jar', jar.absolutePath
                ).inheritIO().directory(rootDir)
                pb.environment().putAll(envVars)
                pb.start().waitFor()
            }
        }
    }
}
