spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: member
    table: flyway_schema_history

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-signing-must-be-long-enough
  access-expiration-ms: 1800000
  refresh-expiration-ms: 3600000
