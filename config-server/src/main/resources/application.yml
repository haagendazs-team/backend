server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file://${user.home}/config-repo}
          default-label: main
          clone-on-start: true
          username: ${GITHUB_CONFIG_SERVER:}
          password: ${GITHUB_CONFIG_SERVER:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
