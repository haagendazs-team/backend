plugins {
    id 'org.springframework.boot'
    id 'jacoco'
}

// sportsify 원본 파일은 검토용 staging 폴더 (java/)이므로 컴파일에서 제외
sourceSets {
    main {
        java {
            exclude 'java/**'
        }
    }
}

// notification 서비스 — WebFlux(Netty) + R2DBC(논블로킹 PostgreSQL)
// JPA/Hibernate 사용 금지: Netty 이벤트 루프에서 블로킹 JDBC 호출은 스레드 고갈을 유발함
// 엔티티: @Table (Spring Data R2DBC) 사용, @Entity (JPA) 사용 금지
// Repository: ReactiveCrudRepository 또는 R2dbcRepository 상속
// 트랜잭션: @Transactional (org.springframework.transaction) 사용 가능 — R2DBC TransactionManager가 처리
dependencies {
    implementation project(':common')

    // WebFlux (Netty 런타임)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // R2DBC (논블로킹 PostgreSQL 드라이버)
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql'

    // Redis (Reactive)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Flyway — R2DBC와 공존 가능, 스키마 마이그레이션 전용 (JDBC URL 별도 설정 필요)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Flyway는 내부적으로 JDBC를 사용하므로 JDBC 드라이버를 런타임에 추가
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Email (블로킹 IO — Dispatcher에서 boundedElastic()으로 래핑)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Jackson for ObjectMapper
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Scheduling
    implementation 'org.springframework.boot:spring-boot-starter'
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 커버리지에서 제외: 인프라 어댑터, 설정 클래스, 엔트리포인트, 통합환경 의존 서비스
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/haagendazs/NotificationApplication.class',
                // infrastructure — 외부 의존성 직접 연동
                'com/haagendazs/infrastructure/repository/**',
                'com/haagendazs/infrastructure/config/**',
                'com/haagendazs/infrastructure/slack/**',
                'com/haagendazs/infrastructure/scheduler/**',
                'com/haagendazs/infrastructure/publisher/**',
                'com/haagendazs/infrastructure/sse/**',
                'com/haagendazs/infrastructure/sender/**',
                'com/haagendazs/infrastructure/redis/**',
                // presentation — 컨트롤러 계층
                'com/haagendazs/presentation/**',
                // application — 포트/리스너/발신자
                'com/haagendazs/application/listener/**',
                'com/haagendazs/application/port/**',
                'com/haagendazs/application/sender/**',
                // 통합환경(Redis/DB/Mail) 의존 서비스 — 단위 테스트 범위 외
                'com/haagendazs/application/service/Dispatcher.class',
                'com/haagendazs/application/service/BulkPersistService.class',
                'com/haagendazs/application/service/FanoutService.class',
                'com/haagendazs/application/service/SlackCommandService.class',
                'com/haagendazs/application/service/BufferedChunkService.class',
                'com/haagendazs/application/service/NotificationBatchBuffer.class',
                'com/haagendazs/application/service/EventStatusService.class',
                'com/haagendazs/application/service/NotificationService.class',
                'com/haagendazs/application/service/ScheduledNotificationProcessor.class',
                'com/haagendazs/application/service/ScheduledEventClaimService.class',
                'com/haagendazs/application/service/ChunkService.class',
                'com/haagendazs/application/service/SingleTargetResult.class',
                'com/haagendazs/infrastructure/consumer/PelMessageProcessor.class',
                'com/haagendazs/infrastructure/consumer/StreamMaintenanceScheduler.class',
            ])
        }))
    }
}
