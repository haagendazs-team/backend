server:
  port: 8081
  netty:
    connection-timeout: 30s
    idle-timeout: 90s
    worker-count: 16

spring:
  application:
    name: notification
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  # R2DBC — 논블로킹 DB 연결 (Netty 이벤트 루프 전용)
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:haagendazs}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    properties:
      schema: notification
    pool:
      initial-size: ${R2DBC_POOL_INITIAL:10}
      max-size: ${R2DBC_POOL_MAX:50}

  # Flyway는 JDBC URL로 별도 동작 (R2DBC URL과 독립적)
  flyway:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:haagendazs}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    schemas: notification
    table: flyway_schema_history

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    topics:
      push: member.notif.push.v1,chat.notif.push.v1,payment.notif.push.v1
      email-cert: member.notif.email-cert.v1
      member-created: member.created.v1

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:no-reply@haagendazs.local}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: notification
    enable:
      reactor.netty: true
  server:
    netty:
      metrics: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

notification:
  pel:
    claim-min-idle: 5m
    batch-size: 100
    stuck-timeout: 10m
    backoff-minutes: [1, 5, 30, 120, 360]
    max-stuck-retry: 3
  stream:
    max-len: 200000
  scheduler:
    reserved-dispatch-cron: "0 0/5 * * * *"
    stream-trim-cron: "0 0 * * * *"
    stuck-recovery-cron: "0 0/10 * * * *"
    pel-reclaim-cron: "0 0/2 * * * *"
    leader-lock-ttl: 4m
  channel:
    max-per-member: 2
  fanout:
    chunk-size: 500
  payload:
    game-start-offset-minutes: 30
  sse:
    timeout-ms: 90000
    ping-interval-ms: 30000
    ping-cron: "0/30 * * * * *"
  buffer:
    max-size: 1000
    flush-interval: 200ms
