server:
  port: 8081

spring:
  application:
    name: notification
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  # R2DBC — 논블로킹 DB 연결 (Netty 이벤트 루프 전용)
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:haagendazs}?schema=notification
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  # Flyway는 JDBC URL로 별도 동작 (R2DBC URL과 독립적)
  flyway:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:haagendazs}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    schemas: notification
    table: flyway_schema_history

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: notification

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
