name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !github.event.pull_request)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect changed modules
        id: changed
        run: |
          MODULES="config-server discovery gateway member payment search notification chat common"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi

          # 브랜치 최초 push 시 before SHA가 zeros — 전체 테스트로 폴백
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            TEST_TASKS=""
            for MODULE in $MODULES; do
              TEST_TASKS="$TEST_TASKS :${MODULE}:test"
            done
            echo "test_tasks=${TEST_TASKS}" >> "$GITHUB_OUTPUT"
            echo "Test tasks (full — first push): ${TEST_TASKS}"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          TEST_TASKS=""
          for MODULE in $MODULES; do
            if echo "$CHANGED_FILES" | grep -q "^${MODULE}/"; then
              TEST_TASKS="$TEST_TASKS :${MODULE}:test"
            fi
          done

          # 공통 모듈 변경 시 전체 테스트
          if echo "$CHANGED_FILES" | grep -q "^common/"; then
            TEST_TASKS=""
            for MODULE in $MODULES; do
              TEST_TASKS="$TEST_TASKS :${MODULE}:test"
            done
          fi

          echo "test_tasks=${TEST_TASKS}" >> "$GITHUB_OUTPUT"
          echo "Test tasks: ${TEST_TASKS}"

      - name: Build
        run: ./gradlew build -x test

      - name: Test changed modules
        if: steps.changed.outputs.test_tasks != ''
        run: ./gradlew ${{ steps.changed.outputs.test_tasks }}

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
# CD off
