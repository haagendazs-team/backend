name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !github.event.pull_request)
    outputs:
      modules: ${{ steps.changed.outputs.modules }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changed
        run: |
          ALL_MODULES="config-server discovery gateway member payment search notification chat common"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_MODULES="$ALL_MODULES"
          else
            CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            if echo "$CHANGED_FILES" | grep -q "^common/"; then
              CHANGED_MODULES="$ALL_MODULES"
            else
              CHANGED_MODULES=""
              for MODULE in $ALL_MODULES; do
                if echo "$CHANGED_FILES" | grep -q "^${MODULE}/"; then
                  CHANGED_MODULES="$CHANGED_MODULES $MODULE"
                fi
              done
            fi
          fi

          CHANGED_MODULES=$(echo "$CHANGED_MODULES" | xargs)
          JSON=$(echo "$CHANGED_MODULES" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          echo "modules=$JSON" >> "$GITHUB_OUTPUT"
          echo "Modules to test: $JSON"


  build:
    runs-on: ubuntu-latest
    needs: detect-modules

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      - name: Upload build classes
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-cache
          path: |
            **/build/classes
            **/build/generated
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: [detect-modules, build]
    if: needs.detect-modules.outputs.modules != '[]'
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download build classes
        uses: actions/download-artifact@v4
        with:
          name: gradle-build-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:test
# CD off
